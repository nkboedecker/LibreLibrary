repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: uv run nox -s lint
        language: system
        pass_filenames: false
      - id: format
        name: format
        entry: uv run nox -s format
        language: system
        pass_filenames: false
      - id: typecheck
        name: typecheck
        entry: uv run nox -s typecheck
        language: system
        pass_filenames: false
      - id: workflows
        name: workflows
        entry: uv run nox -s workflows
        language: system
        pass_filenames: false
