[project]
name = "librelibrary"
version = "0.1.0.dev0"
description = "A free, open-source, self-hosted personal library server."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Natalie Boedecker" }]
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.162.0",
    "jinja2==3.1.6",
    "limits==5.8.0",
    "pg8000==1.31.6",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "sqlalchemy==2.1.6",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[project.scripts]
librelibrary = "librelibrary.cli:main"

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "httpx==0.28.1",
    "hypothesis==6.170.14",
    "mike==2.2.0",
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.0",
    "mypy==2.4.1",
    "nox==2026.10.20",
    "pip-licenses==5.5.5",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "schemathesis==4.32.7",
    "zizmor==1.31.1",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
src = ["src", "tests", "tools"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "N", "S", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"tools/**" = ["S603"]
"noxfile.py" = ["S603"]

[tool.mypy]
strict = true
files = ["src", "tests", "tools", "migrations", "noxfile.py"]
mypy_path = "src:tools"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["librelibrary"]
branch = true

[tool.coverage.report]
show_missing = true
