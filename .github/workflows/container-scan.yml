name: Container scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "37 6 * * 1"

permissions: {}

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run nox -s image
      # List everything, including Debian findings with no fix yet.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: librelibrary:dev
          fail-build: false
          output-format: table
      # Fail only on what an update can fix.
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: librelibrary:dev
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
